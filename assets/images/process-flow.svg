<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Trader Tykoon Q38 Process Flow</title>
  <desc id="desc">A process flow showing market input, signal review, risk check, and reporting stages.</desc>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="52" font-size="30" text-anchor="middle" font-family="Arial, sans-serif" fill="#0f172a">Project Process Flow</text>

  <rect x="90" y="120" width="190" height="120" rx="16" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="185" y="175" text-anchor="middle" font-size="20" font-family="Arial, sans-serif" fill="#0f172a">Source Data</text>

  <rect x="330" y="120" width="200" height="120" rx="16" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="430" y="175" text-anchor="middle" font-size="20" font-family="Arial, sans-serif" fill="#0f172a">Normalize</text>

  <rect x="580" y="120" width="210" height="120" rx="16" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="685" y="175" text-anchor="middle" font-size="20" font-family="Arial, sans-serif" fill="#0f172a">Assess</text>

  <rect x="850" y="120" width="210" height="120" rx="16" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <text x="955" y="175" text-anchor="middle" font-size="20" font-family="Arial, sans-serif" fill="#0f172a">Review</text>

  <rect x="470" y="360" width="260" height="140" rx="16" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="600" y="415" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" fill="#0f172a">Risk Check</text>
  <text x="600" y="445" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" fill="#334155">Approval Gate</text>

  <rect x="820" y="360" width="220" height="140" rx="16" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="930" y="415" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" fill="#0f172a">Monitor</text>
  <text x="930" y="445" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" fill="#334155">Report</text>

  <path d="M280 180 H330" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M530 180 H580" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M790 180 H850" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M955 240 L955 290 L600 290 L600 360" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M600 500 L600 560 L930 560 L930 500" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
</svg>
